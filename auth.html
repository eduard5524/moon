<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Moon</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav class="navbar scrolled">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">&#9790;</span>
                <span class="logo-text">Moon</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html#features">Features</a></li>
                <li><a href="index.html#architecture">Architecture</a></li>
                <li><a href="docs/index.html" class="nav-docs-link">Docs</a></li>
            </ul>
            <div class="nav-actions">
                <a href="https://github.com/eduard5524/moon" class="btn btn-ghost" target="_blank">GitHub</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-bg">
            <div class="hero-glow"></div>
        </div>
        <div class="auth-card">
            <div class="auth-header">
                <span class="logo-icon auth-logo">&#9790;</span>
                <h1 id="auth-title">Sign In</h1>
                <p id="auth-subtitle">Access your Moon AI workspace</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <div id="login-error" class="form-error"></div>
                <button type="submit" class="btn btn-primary btn-full">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" placeholder="Create a password" required minlength="6">
                </div>
                <div id="register-error" class="form-error"></div>
                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>

            <div class="auth-toggle">
                <p id="toggle-text">Don't have an account? <a href="#" id="toggle-link">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
